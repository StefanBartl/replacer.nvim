name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint:
    name: luacheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v6

      - name: Install luacheck
        run: luarocks install luacheck 1.2.0

      - name: Run luacheck
        run: find lua plugin TESTS -name '*.lua' | xargs luacheck

  fmt:
    name: stylua --check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check lua/ TESTS/

  test:
    name: headless test suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One platform failing must not cancel the others: which of the three
      # broke is the whole information content of this job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Windows runners default to PowerShell; one shell on all three keeps
        # the run step itself from being what differs between platforms.
        shell: bash
    # TESTS/resolve_lib_nvim.lua/resolve_ui_nvim.lua look for a *sibling*
    # checkout (<repo>/../lib.nvim, <repo>/../ui.nvim), but this job checks
    # them out *inside* the workspace so `set rtp+=./lib.nvim`/`./ui.nvim`
    # work. $LIB_NVIM_PATH/$UI_NVIM_PATH are the resolvers' own
    # first-priority override, meant for exactly this case.
    env:
      # scripts/test.sh and TESTS/minimal_init.lua look for $<NAME>_DIR ...
      TESTING_NVIM_DIR: ${{ github.workspace }}/testing.nvim
      LIB_NVIM_DIR: ${{ github.workspace }}/lib.nvim
      UI_NVIM_DIR: ${{ github.workspace }}/ui.nvim
      # ... and the scripts' own resolvers (TESTS/resolve_*.lua) the *_PATH
      # spelling; .testing.lua lets them through to the child editor.
      LIB_NVIM_PATH: ${{ github.workspace }}/lib.nvim
      UI_NVIM_PATH: ${{ github.workspace }}/ui.nvim
      PICKERS_NVIM_PATH: ${{ github.workspace }}/pickers.nvim
    steps:
      - uses: actions/checkout@v5

      # Tests require lib.nvim on the runtimepath (the plugin's own hard
      # dependency for the command layer, notifications, confirm dialog,
      # and export) -- checked out as a subdirectory of the workspace so it
      # can be added via `set rtp+=./lib.nvim` below.
      - uses: actions/checkout@v5
        with:
          repository: WKDSteve/lib.nvim
          path: lib.nvim
          ref: ci-verified

      # ui.nvim: same tier as lib.nvim above -- ui.kit.confirm is
      # require()d unconditionally by replacer.init, not soft.
      - uses: actions/checkout@v5
        with:
          repository: WKDSteve/ui.nvim
          path: ui.nvim
          ref: ci-verified

      # pickers.nvim is a *soft* dependency (only the picker `filter` key
      # needs it). refine_wiring.lua exercises that wiring; without this
      # checkout it would only run the engine-agnostic half.
      - uses: actions/checkout@v5
        with:
          repository: WKDSteve/pickers.nvim
          path: pickers.nvim
          ref: ci-verified

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Install ripgrep
        run: |
          # `rg` is a real dependency of these specs, not a convenience -- they
          # shell out to it. The install is the one step that has to differ per
          # runner image; everything after it is identical on all three. The
          # `rg --version` at the end is the actual gate: if a package manager
          # silently no-ops, the suite must not start and then fail obscurely.
          case "${{ runner.os }}" in
            Linux)   sudo apt-get update && sudo apt-get install -y ripgrep ;;
            macOS)   brew install ripgrep || true ;;
            Windows) choco install ripgrep -y --no-progress ;;
          esac
          rg --version

      # Checked out from the branch that only moves once the dependency's own CI is green.
      - uses: actions/checkout@v5
        with:
          repository: "WKDSteve/testing.nvim"
          path: testing.nvim
          ref: ci-verified
      # Every script under TESTS/ runs on testing.nvim (dialect "script", one
      # editor per file); a script that dies halfway is a failed case, which is
      # what TESTS/ci_guard.lua used to enforce.
      - name: Run the specs
        run: bash scripts/test.sh --json "$RUNNER_TEMP/testing-ir.json"
      # The IR is what a reporter or a person reads to find out WHICH case failed on WHICH platform.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: testing-ir-${{ matrix.os }}
          path: ${{ runner.temp }}/testing-ir.json
          if-no-files-found: ignore
          retention-days: 14
