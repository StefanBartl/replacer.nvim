name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint:
    name: luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v4

      - name: Install luacheck
        run: luarocks install luacheck 1.2.0

      - name: Run luacheck
        run: find lua plugin -name '*.lua' | xargs luacheck

  fmt:
    name: stylua --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check lua/

  test:
    name: headless test suite (${{ matrix.os }})
    runs-on: ${{{{ matrix.os }}}}
    strategy:
      # One platform failing must not cancel the others: which of the three
      # broke is the whole information content of this job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Windows runners default to PowerShell; one shell on all three keeps
        # the run step itself from being what differs between platforms.
        shell: bash
    # TESTS/resolve_lib_nvim.lua/resolve_ui_nvim.lua look for a *sibling*
    # checkout (<repo>/../lib.nvim, <repo>/../ui.nvim), but this job checks
    # them out *inside* the workspace so `set rtp+=./lib.nvim`/`./ui.nvim`
    # work. $LIB_NVIM_PATH/$UI_NVIM_PATH are the resolvers' own
    # first-priority override, meant for exactly this case.
    env:
      LIB_NVIM_PATH: ${{ github.workspace }}/lib.nvim
      UI_NVIM_PATH: ${{ github.workspace }}/ui.nvim
      PICKERS_NVIM_PATH: ${{ github.workspace }}/pickers.nvim
    steps:
      - uses: actions/checkout@v5

      # Tests require lib.nvim on the runtimepath (the plugin's own hard
      # dependency for the command layer, notifications, confirm dialog,
      # and export) -- checked out as a subdirectory of the workspace so it
      # can be added via `set rtp+=./lib.nvim` below.
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/lib.nvim
          path: lib.nvim
          ref: ci-verified

      # ui.nvim: same tier as lib.nvim above -- ui.kit.confirm is
      # require()d unconditionally by replacer.init, not soft.
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/ui.nvim
          path: ui.nvim

      # pickers.nvim is a *soft* dependency (only the picker `filter` key
      # needs it). refine_wiring.lua exercises that wiring; without this
      # checkout it would only run the engine-agnostic half.
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/pickers.nvim
          path: pickers.nvim

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Install ripgrep
        run: |
          # `rg` is a real dependency of these specs, not a convenience -- they
          # shell out to it. The install is the one step that has to differ per
          # runner image; everything after it is identical on all three. The
          # `rg --version` at the end is the actual gate: if a package manager
          # silently no-ops, the suite must not start and then fail obscurely.
          case "${{ runner.os }}" in
            Linux)   sudo apt-get update && sudo apt-get install -y ripgrep ;;
            macOS)   brew install ripgrep || true ;;
            Windows) choco install ripgrep -y --no-progress ;;
          esac
          rg --version

      - name: feature_smoke.lua
        run: >-
          nvim --headless -u NONE
          -c "set rtp+=." -c "set rtp+=./lib.nvim" -c "set rtp+=./ui.nvim"
          -c "luafile TESTS/feature_smoke.lua" -c "qa"

      - name: surround_smoke.lua
        run: >-
          nvim --headless -u NONE
          -c "set rtp+=." -c "set rtp+=./lib.nvim" -c "set rtp+=./ui.nvim"
          -c "luafile TESTS/surround_smoke.lua" -c "qa"

      - name: async_utf8.lua
        run: >-
          nvim --headless -u NONE
          -c "set rtp+=." -c "set rtp+=./lib.nvim" -c "set rtp+=./ui.nvim"
          -c "luafile TESTS/async_utf8.lua" -c "qa"

      - name: refine_wiring.lua
        run: >-
          nvim --headless -u NONE
          -c "set rtp+=." -c "set rtp+=./lib.nvim" -c "set rtp+=./ui.nvim" -c "set rtp+=./pickers.nvim"
          -c "luafile TESTS/refine_wiring.lua" -c "qa"

      - name: config_merge.lua
        run: >-
          nvim --headless -u NONE
          -c "set rtp+=." -c "set rtp+=./lib.nvim" -c "set rtp+=./ui.nvim"
          -c "luafile TESTS/config_merge.lua" -c "qa"

      - name: argtypes_debug_error.lua
        run: >-
          nvim --headless -u NONE
          -c "set rtp+=." -c "set rtp+=./lib.nvim" -c "set rtp+=./ui.nvim"
          -c "luafile TESTS/argtypes_debug_error.lua" -c "qa"

      - name: health_pickers_tscode.lua
        run: >-
          nvim --headless -u NONE
          -c "set rtp+=." -c "set rtp+=./lib.nvim" -c "set rtp+=./ui.nvim"
          -c "luafile TESTS/health_pickers_tscode.lua" -c "qa"

      - name: bindings_wiring.lua
        run: >-
          nvim --headless -u NONE
          -c "set rtp+=." -c "set rtp+=./lib.nvim" -c "set rtp+=./ui.nvim"
          -c "luafile TESTS/bindings_wiring.lua" -c "qa"

      - name: init_dispatch.lua
        run: >-
          nvim --headless -u NONE
          -c "set rtp+=." -c "set rtp+=./lib.nvim" -c "set rtp+=./ui.nvim"
          -c "luafile TESTS/init_dispatch.lua" -c "qa"

      - name: pickers_backends.lua
        run: >-
          nvim --headless -u NONE
          -c "set rtp+=." -c "set rtp+=./lib.nvim" -c "set rtp+=./ui.nvim"
          -c "luafile TESTS/pickers_backends.lua" -c "qa"
